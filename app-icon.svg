<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- marktree: das Schlaginstrument, eine Leiste mit hängenden Metallstäben abnehmender Länge -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3646"/>
      <stop offset="1" stop-color="#1a2029"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4efe4"/>
      <stop offset="0.55" stop-color="#d9dde3"/>
      <stop offset="1" stop-color="#a9b1bd"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>

  <!-- Holzleiste -->
  <rect x="196" y="196" width="632" height="60" rx="30" fill="#c8793a"/>

  <!-- Stäbe, von links nach rechts kürzer -->
  <g fill="url(#metal)">
    <rect x="238" y="284" width="52" height="540" rx="26"/>
    <rect x="338" y="284" width="52" height="480" rx="26"/>
    <rect x="438" y="284" width="52" height="420" rx="26"/>
    <rect x="538" y="284" width="52" height="360" rx="26"/>
    <rect x="638" y="284" width="52" height="300" rx="26"/>
    <rect x="738" y="284" width="52" height="240" rx="26"/>
  </g>
</svg>
